<body>

<div class="container">

<h1>WELCOME TO LUCKY ISH WEBSITE</h1>
<p>Student Marks Calculator</p>

<input id="name" placeholder="Student Name">

<input id="adm" placeholder="Admission Number">

<input id="eng" type="number" placeholder="English Marks">

<input id="math" type="number" placeholder="Maths Marks">

<button onclick="checkResult()">CHECK MY RESULT</button>

<div id="result"></div>

</div>

<script>
function checkResult() {

let name = document.getElementById("name").value;
let adm = document.getElementById("adm").value;
let eng = Number(document.getElementById("eng").value);
let math = Number(document.getElementById("math").value);

if (!name || !adm ||
document.getElementById("eng").value === "" ||
document.getElementById("math").value === "") {
alert("Please fill all fields!");
return;
}

if (eng < 0 || eng > 100 ||
math < 0 || math > 100) {
alert("Marks must be between 0 and 100!");
return;
}

let total = eng + math;
let average = total / 2;

let grade = average >= 80 ? "A" :
average >= 70 ? "B" :
average >= 60 ? "C" :
average >= 50 ? "D" : "E";

document.getElementById("result").innerHTML =
"Student: " + name +
"<br>Admission: " + adm +
"<br>Total Marks: " + total +
"<br>Average: " + average +
"<br>Grade: " + grade;
}
</script>
